<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixIt | User Login</title>
  <link rel="shortcut icon" href="../../images/logo.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
  <style>
    :root {
      --blue: #1a73f8;
      --blue-dark: #0d4fd6;
      --accent: #00e5c0;
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1c2333;
      --text: #f0f4ff;
      --muted: #7b8db0;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(26,115,248,0.5);
      --red: #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black, transparent);
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      opacity: 0.25; pointer-events: none;
      animation: floatOrb 8s ease-in-out infinite;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(26,115,248,0.4); top: -100px; left: -100px; }
    .orb-2 { width: 280px; height: 280px; background: rgba(0,229,192,0.25); bottom: -70px; right: -70px; animation-delay: -4s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-22px); }
    }

    /* card */
    .auth-card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 44px;
      width: 100%; max-width: 420px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: popIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* top accent */
    .card-top-accent {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--accent));
      border-radius: 28px 28px 0 0;
    }

    /* header */
    .card-header { text-align: center; margin-bottom: 36px; }

    .card-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
      color: var(--text); text-decoration: none; display: inline-block; margin-bottom: 20px;
    }
    .card-logo span { color: var(--blue); }

    .role-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(26,115,248,0.1); border: 1px solid rgba(26,115,248,0.25);
      color: #7bb3ff; font-size: 0.7rem; font-weight: 600;
      padding: 4px 12px; border-radius: 50px; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 16px;
    }

    .role-chip-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .card-title {
      font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }

    .card-sub { font-size: 0.82rem; color: var(--muted); }

    /* form */
    .field-group { margin-bottom: 20px; }

    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
    }
    .field-label i { color: var(--blue); }

    .input-wrap { position: relative; }

    .styled-input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      padding: 13px 16px 13px 44px;
      border-radius: 12px; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .styled-input::placeholder { color: rgba(123,141,176,0.45); }
    .styled-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(26,115,248,0.1); }

    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; pointer-events: none; transition: color 0.2s;
    }

    .input-wrap:focus-within .input-icon { color: var(--blue); }

    /* password toggle */
    .input-wrap .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.95rem; padding: 0; transition: color 0.2s;
    }
    .input-wrap .eye-btn:hover { color: var(--text); }

    /* forgot */
    .forgot-row {
      display: flex; justify-content: flex-end; margin-bottom: 24px; margin-top: -10px;
    }
    .forgot-row a { font-size: 0.78rem; color: #7bb3ff; text-decoration: none; transition: color 0.2s; }
    .forgot-row a:hover { color: var(--text); }

    /* submit */
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: var(--blue); color: white;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 500;
      cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
      position: relative; overflow: hidden;
    }
    .btn-submit::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.12), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-submit:hover { background: var(--blue-dark); transform: translateY(-1px); box-shadow: 0 10px 28px rgba(26,115,248,0.4); }
    .btn-submit:hover::before { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }

    /* divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 24px 0; color: rgba(123,141,176,0.4); font-size: 0.75rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* signup link */
    .signup-row {
      text-align: center; font-size: 0.82rem; color: var(--muted);
    }
    .signup-row a { color: #7bb3ff; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .signup-row a:hover { color: var(--text); }

    /* back link */
    .back-link {
      display: flex; align-items: center; gap: 6px; justify-content: center;
      margin-top: 20px; font-size: 0.78rem; color: rgba(123,141,176,0.5);
      text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: var(--muted); }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-card">
  <div class="card-top-accent"></div>

  <div class="card-header">
    <a class="card-logo" href="../../index.html">Fix<span>It</span> ↗</a>
    <br/>
    <span class="role-chip"><div class="role-chip-dot"></div> Citizen Portal</span>
    <h1 class="card-title">Welcome back</h1>
    <p class="card-sub">Sign in to track and manage your complaints</p>
  </div>

  <form method="post" action="/user/login" onsubmit="return validateLogin()">

    <div class="field-group">
      <div class="field-label"><i class="bi bi-person"></i> Username</div>
      <div class="input-wrap">
        <i class="bi bi-person input-icon"></i>
        <input class="styled-input" type="text" name="username" id="username" placeholder="Enter your username" required />
      </div>
    </div>

    <div class="field-group">
      <div class="field-label"><i class="bi bi-lock"></i> Password</div>
      <div class="input-wrap">
        <i class="bi bi-lock input-icon"></i>
        <input class="styled-input" type="password" name="password" id="password" placeholder="Enter your password" required style="padding-right:44px"/>
        <button type="button" class="eye-btn" onclick="togglePwd('password', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
    </div>

    <div class="forgot-row">
      <a href="#">Forgot password?</a>
    </div>

    <button type="submit" class="btn-submit">
      <i class="bi bi-box-arrow-in-right"></i> Sign In
    </button>

  </form>

  <div class="divider">or</div>

  <div class="signup-row">
    Don't have an account? <a href="./signup.html">Create one →</a>
  </div>

  <a class="back-link" href="../login.html">
    <i class="bi bi-arrow-left" style="font-size:0.7rem"></i> Back to role selection
  </a>
</div>

<script>
  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }
  function showError(msg) {
    let box = document.getElementById('error-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'error-box';
      box.style.cssText = `
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        margin-bottom: 16px;
        line-height: 1.5;
      `;
      const form = document.querySelector('form');
      form.insertBefore(box, form.firstChild);
    }
    box.innerHTML = msg;
  }

  function hideError() {
    const box = document.getElementById('error-box');
    if (box) box.remove();
  }

  function validateLogin() {
    hideError();

    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();

    // Username empty check
    if (username === '') {
      showError('❌ Please enter your username.');
      return false;
    }

    // Password empty check
    if (password === '') {
      showError('❌ Please enter your password.');
      return false;
    }

    return true; // sab sahi — server ko jaayega
  }
</script>
</body>
</html>
