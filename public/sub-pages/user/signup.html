<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixIt | Create Account</title>
  <link rel="shortcut icon" href="../../images/logo.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
  <style>
    :root {
      --blue: #1a73f8;
      --blue-dark: #0d4fd6;
      --accent: #00e5c0;
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1c2333;
      --text: #f0f4ff;
      --muted: #7b8db0;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(26,115,248,0.5);
      --green: #22c55e;
      --red: #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow: hidden;
    }

    .bg-grid {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black, transparent);
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(80px);
      opacity: 0.25; pointer-events: none;
      animation: floatOrb 8s ease-in-out infinite;
    }
    .orb-1 { width: 380px; height: 380px; background: rgba(0,229,192,0.3); top: -90px; right: -90px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(26,115,248,0.3); bottom: -70px; left: -70px; animation-delay: -4s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }

    /* card */
    .auth-card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      padding: 48px 44px;
      width: 100%; max-width: 440px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: popIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.94) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .card-top-accent {
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--accent), var(--blue));
      border-radius: 28px 28px 0 0;
    }

    /* header */
    .card-header { text-align: center; margin-bottom: 32px; }

    .card-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.3rem;
      color: var(--text); text-decoration: none; display: inline-block; margin-bottom: 20px;
    }
    .card-logo span { color: var(--blue); }

    .role-chip {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(0,229,192,0.08); border: 1px solid rgba(0,229,192,0.22);
      color: var(--accent); font-size: 0.7rem; font-weight: 600;
      padding: 4px 12px; border-radius: 50px; letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 16px;
    }

    .role-chip-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    .card-title {
      font-family: 'Syne', sans-serif; font-size: 1.7rem; font-weight: 800;
      letter-spacing: -0.5px; margin-bottom: 6px;
    }

    .card-sub { font-size: 0.82rem; color: var(--muted); }

    /* strength bar */
    .strength-wrap { margin-top: 8px; }
    .strength-bar { display: flex; gap: 4px; margin-bottom: 4px; }
    .strength-seg {
      flex: 1; height: 3px; border-radius: 2px;
      background: var(--surface2); transition: background 0.3s;
    }
    .strength-label { font-size: 0.68rem; color: var(--muted); }

    /* form */
    .field-group { margin-bottom: 18px; }

    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.75rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
    }
    .field-label i { color: var(--blue); }

    .input-wrap { position: relative; }

    .styled-input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      padding: 13px 16px 13px 44px;
      border-radius: 12px; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; outline: none; transition: border-color 0.2s, box-shadow 0.2s;
    }
    .styled-input::placeholder { color: rgba(123,141,176,0.45); }
    .styled-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(26,115,248,0.1); }
    .styled-input.valid { border-color: rgba(34,197,94,0.45); }
    .styled-input.invalid { border-color: rgba(239,68,68,0.45); }

    .input-icon {
      position: absolute; left: 14px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 1rem; pointer-events: none; transition: color 0.2s;
    }
    .input-wrap:focus-within .input-icon { color: var(--blue); }

    .input-status {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      font-size: 0.85rem; display: none;
    }

    .eye-btn {
      position: absolute; right: 14px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: var(--muted); cursor: pointer;
      font-size: 0.95rem; padding: 0; transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--text); }

    /* terms */
    .terms-wrap {
      display: flex; align-items: flex-start; gap: 10px;
      margin-bottom: 22px; cursor: pointer;
    }
    .terms-wrap input[type="checkbox"] { display: none; }
    .custom-check {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0;
      border: 1px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; margin-top: 1px;
    }
    .terms-wrap input:checked + .custom-check { background: var(--blue); border-color: var(--blue); }
    .terms-wrap input:checked + .custom-check::after { content: '✓'; font-size: 0.65rem; color: white; font-weight: 700; }
    .terms-text { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .terms-text a { color: #7bb3ff; text-decoration: none; }
    .terms-text a:hover { text-decoration: underline; }

    /* submit */
    .btn-submit {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, var(--blue), rgba(0,229,192,0.7));
      color: white; font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem; font-weight: 500; cursor: pointer;
      transition: all 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover { opacity: 0.9; transform: translateY(-1px); box-shadow: 0 10px 28px rgba(26,115,248,0.35); }
    .btn-submit:active { transform: translateY(0); }

    /* divider */
    .divider {
      display: flex; align-items: center; gap: 12px;
      margin: 22px 0; color: rgba(123,141,176,0.4); font-size: 0.75rem;
    }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    /* login row */
    .login-row { text-align: center; font-size: 0.82rem; color: var(--muted); }
    .login-row a { color: #7bb3ff; text-decoration: none; font-weight: 500; transition: color 0.2s; }
    .login-row a:hover { color: var(--text); }

    .back-link {
      display: flex; align-items: center; gap: 6px; justify-content: center;
      margin-top: 20px; font-size: 0.78rem; color: rgba(123,141,176,0.5);
      text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: var(--muted); }

    /* perks list */
    .perks {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 28px;
    }
    .perk {
      display: flex; align-items: center; gap: 9px;
      font-size: 0.78rem; color: var(--muted);
    }
    .perk-dot {
      width: 18px; height: 18px; border-radius: 50%; flex-shrink: 0;
      background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.55rem; color: var(--green);
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="auth-card">
  <div class="card-top-accent"></div>

  <div class="card-header">
    <a class="card-logo" href="../../index.html">Fix<span>It</span> ↗</a>
    <br/>
    <span class="role-chip"><div class="role-chip-dot"></div> Join FixIt</span>
    <h1 class="card-title">Create account</h1>
    <p class="card-sub">Start reporting issues and building a better community</p>
  </div>

  <!-- perks -->
  <div class="perks">
    <div class="perk"><div class="perk-dot">✓</div> File unlimited complaints for free</div>
    <div class="perk"><div class="perk-dot">✓</div> Real-time status tracking</div>
    <div class="perk"><div class="perk-dot">✓</div> Direct officer communication</div>
  </div>

  <form method="post" action="/user/signup" novalidate onsubmit="return validateForm()">

    <div class="field-group">
      <div class="field-label"><i class="bi bi-person"></i> Username</div>
      <div class="input-wrap">
        <i class="bi bi-person input-icon"></i>
        <input class="styled-input" type="text" name="username" id="username"
               placeholder="Choose a username" required
               oninput="validateField(this, v => v.length >= 3)"/>
        <span class="input-status" id="username-status"></span>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label"><i class="bi bi-envelope"></i> Email</div>
      <div class="input-wrap">
        <i class="bi bi-envelope input-icon"></i>
        <input class="styled-input" type="email" name="email" id="email"
               placeholder="your@email.com" required
               oninput="validateField(this, v => /^[a-zA-Z0-9._%+-]+@(gmail\.com|yahoo\.com|outlook\.com|hotmail\.com|rediffmail\.com|icloud\.com)$/.test(v))"/>
        <span class="input-status" id="email-status"></span>
      </div>
    </div>

    <div class="field-group">
      <div class="field-label"><i class="bi bi-lock"></i> Password</div>
      <div class="input-wrap">
        <i class="bi bi-lock input-icon"></i>
        <input class="styled-input" type="password" name="password" id="password"
               placeholder="Create a strong password" required
               style="padding-right:44px"
               oninput="handlePassword(this)"/>
        <button type="button" class="eye-btn" onclick="togglePwd('password', this)">
          <i class="bi bi-eye"></i>
        </button>
      </div>
      <div class="strength-wrap">
        <div class="strength-bar">
          <div class="strength-seg" id="s1"></div>
          <div class="strength-seg" id="s2"></div>
          <div class="strength-seg" id="s3"></div>
          <div class="strength-seg" id="s4"></div>
        </div>
        <span class="strength-label" id="strength-label">Enter a password</span>
      </div>
    </div>

    <label class="terms-wrap">
      <input type="checkbox" id="terms" required />
      <span class="custom-check"></span>
      <span class="terms-text">
        I agree to the <a href="#">Terms of Service</a> and
        <a href="#">Privacy Policy</a>
      </span>
    </label>

    <button type="submit" class="btn-submit">
      <i class="bi bi-person-check"></i> Create Account
    </button>

  </form>

  <div class="divider">already have an account?</div>

  <div class="login-row">
    <a href="./login.html">← Sign in instead</a>
  </div>

  <a class="back-link" href="../login.html">
    <i class="bi bi-arrow-left" style="font-size:0.7rem"></i> Back to role selection
  </a>
</div>

<script>
  function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const icon = btn.querySelector('i');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'bi bi-eye-slash';
    } else {
      input.type = 'password';
      icon.className = 'bi bi-eye';
    }
  }

  function validateField(input, testFn) {
    const statusEl = document.getElementById(input.id + '-status');
    if (!input.value) { input.className = 'styled-input'; if (statusEl) statusEl.style.display = 'none'; return; }
    const valid = testFn(input.value);
    input.className = 'styled-input ' + (valid ? 'valid' : 'invalid');
    if (statusEl) {
      statusEl.textContent = valid ? '✓' : '✗';
      statusEl.style.color = valid ? '#22c55e' : '#ef4444';
      statusEl.style.display = 'block';
    }
  }

  function handlePassword(input) {
    const v = input.value;
    let score = 0;
    if (v.length >= 8) score++;
    if (/[A-Z]/.test(v)) score++;
    if (/[0-9]/.test(v)) score++;
    if (/[^A-Za-z0-9]/.test(v)) score++;

    const colors = ['', '#ef4444', '#f59e0b', '#3b82f6', '#22c55e'];
    const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

    for (let i = 1; i <= 4; i++) {
      const seg = document.getElementById('s' + i);
      seg.style.background = i <= score ? colors[score] : 'var(--surface2)';
    }

    const label = document.getElementById('strength-label');
    label.textContent = v ? labels[score] || 'Weak' : 'Enter a password';
    label.style.color = colors[score] || 'var(--muted)';
  }
  function showError(msg) {
    let box = document.getElementById('error-box');
    if (!box) {
      box = document.createElement('div');
      box.id = 'error-box';
      box.style.cssText = `
        background: rgba(239,68,68,0.1);
        border: 1px solid rgba(239,68,68,0.3);
        color: #fca5a5;
        padding: 12px 16px;
        border-radius: 10px;
        font-size: 0.82rem;
        margin-bottom: 16px;
        line-height: 1.5;
      `;
      const form = document.querySelector('form');
      form.insertBefore(box, form.firstChild);
    }
    box.innerHTML = msg;
    box.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function hideError() {
    const box = document.getElementById('error-box');
    if (box) box.remove();
  }

  function validateForm() {
    hideError();

    const username = document.getElementById('username').value.trim();
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const terms    = document.getElementById('terms').checked;

    if (username.length < 3) {
      showError('❌ Username must be at least 3 characters.');
      return false;
    }

    const emailRegex = /^[a-zA-Z0-9._%+-]+@(gmail\.com|yahoo\.com|outlook\.com|hotmail\.com|rediffmail\.com|icloud\.com)$/;;
    if (!emailRegex.test(email)) {
      showError('❌ Please enter a valid email.<br>Example: <strong>rahul123@gmail.com</strong>');
      return false;
    }

    const passwordRegex = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&#])[A-Za-z\d@$!%*?&#]{8,}$/;
    if (!passwordRegex.test(password)) {
      showError(`❌ Password is too weak:<br>
        &nbsp;&nbsp;• Min <strong>8 characters</strong><br>
        &nbsp;&nbsp;• 1 <strong>uppercase letter</strong> (A-Z)<br>
        &nbsp;&nbsp;• 1 <strong>number</strong> (0-9)<br>
        &nbsp;&nbsp;• 1 <strong>special character</strong> (@ $ ! % * ? & #)<br>
        Example: <strong>Rahul@1234</strong>`);
      return false;
    }

    if (!terms) {
      showError('❌ Please agree to the Terms of Service.');
      return false;
    }

    return true;
  }
</script>
</body>
</html>
