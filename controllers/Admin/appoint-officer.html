<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FixIt | Appoint Officer</title>
  <link rel="shortcut icon" href="../images/logo.png" type="image/x-icon" />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.3/font/bootstrap-icons.css" />
  <style>
    :root {
      --blue: #1a73f8;
      --blue-dark: #0d4fd6;
      --accent: #00e5c0;
      --bg: #0a0e1a;
      --surface: #111827;
      --surface2: #1c2333;
      --surface3: #222d42;
      --text: #f0f4ff;
      --muted: #7b8db0;
      --border: rgba(255,255,255,0.07);
      --border-focus: rgba(26,115,248,0.5);
      --green: #22c55e;
      --red: #ef4444;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* ── BG DECORATIONS ── */
    .bg-grid {
      position: fixed; inset: 0; pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 55px 55px;
      mask-image: radial-gradient(ellipse 90% 90% at 50% 50%, black, transparent);
    }

    .orb {
      position: fixed; border-radius: 50%; filter: blur(90px);
      opacity: 0.22; pointer-events: none;
      animation: floatOrb 9s ease-in-out infinite;
    }
    .orb-1 { width: 420px; height: 420px; background: rgba(26,115,248,0.35); top: -120px; left: -100px; }
    .orb-2 { width: 300px; height: 300px; background: rgba(0,229,192,0.25); bottom: -80px; right: -80px; animation-delay: -4.5s; }

    @keyframes floatOrb {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-22px); }
    }

    /* ── TOP BREADCRUMB ── */
    .top-bar {
      position: relative; z-index: 1;
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; max-width: 560px;
      margin-bottom: 28px;
      animation: fadeSlideUp 0.4s ease forwards;
    }

    .top-logo {
      font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.2rem;
      color: var(--text); text-decoration: none;
    }
    .top-logo span { color: var(--blue); }

    .admin-chip {
      display: flex; align-items: center; gap: 6px;
      background: rgba(26,115,248,0.1); border: 1px solid rgba(26,115,248,0.22);
      color: #7bb3ff; font-size: 0.7rem; font-weight: 600;
      padding: 4px 12px; border-radius: 50px; letter-spacing: 1px; text-transform: uppercase;
    }
    .chip-dot {
      width: 5px; height: 5px; border-radius: 50%; background: var(--accent);
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

    /* ── MAIN CARD ── */
    .card {
      position: relative; z-index: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 28px;
      width: 100%; max-width: 560px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,0.5);
      animation: popIn 0.5s cubic-bezier(0.34, 1.4, 0.64, 1) forwards;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.95) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    /* ── CARD HEADER ── */
    .card-header {
      padding: 28px 32px 24px;
      background: linear-gradient(135deg, rgba(26,115,248,0.15) 0%, rgba(0,229,192,0.08) 100%);
      border-bottom: 1px solid var(--border);
      position: relative; overflow: hidden;
    }

    .card-header::before {
      content: '';
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 28px 28px;
    }

    /* top accent line */
    .card-header::after {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, var(--blue), var(--accent));
    }

    .header-inner {
      position: relative; z-index: 1;
      display: flex; align-items: center; gap: 16px;
    }

    .header-icon {
      width: 52px; height: 52px; border-radius: 16px; flex-shrink: 0;
      background: rgba(26,115,248,0.15); border: 1px solid rgba(26,115,248,0.25);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem;
      animation: shieldPop 0.5s cubic-bezier(0.34,1.56,0.64,1) 0.2s both;
    }

    @keyframes shieldPop {
      from { opacity: 0; transform: scale(0.5) rotate(-10deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }

    .header-text {}
    .header-title {
      font-family: 'Syne', sans-serif; font-size: 1.35rem; font-weight: 800;
      letter-spacing: -0.3px; margin-bottom: 4px;
    }
    .header-sub { font-size: 0.82rem; color: var(--muted); }

    /* ── CARD BODY ── */
    .card-body { padding: 28px 32px 32px; }

    /* two-col grid for some fields */
    .fields-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0 16px;
    }
    .fields-grid .full-width { grid-column: 1 / -1; }

    /* ── FIELD GROUP ── */
    .field-group { margin-bottom: 18px; }

    .field-label {
      display: flex; align-items: center; gap: 7px;
      font-size: 0.72rem; font-weight: 600; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.7px; margin-bottom: 8px;
    }
    .field-label i { color: var(--blue); font-size: 0.85rem; }

    .input-wrap { position: relative; }

    .styled-input {
      width: 100%; background: var(--surface2);
      border: 1px solid var(--border); color: var(--text);
      padding: 12px 14px 12px 42px;
      border-radius: 11px; font-family: 'DM Sans', sans-serif;
      font-size: 0.875rem; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .styled-input::placeholder { color: rgba(123,141,176,0.45); }
    .styled-input:focus { border-color: var(--border-focus); box-shadow: 0 0 0 3px rgba(26,115,248,0.1); }
    .styled-input.valid { border-color: rgba(34,197,94,0.45); }
    .styled-input.invalid { border-color: rgba(239,68,68,0.4); }

    .input-icon {
      position: absolute; left: 13px; top: 50%; transform: translateY(-50%);
      color: var(--muted); font-size: 0.95rem; pointer-events: none; transition: color 0.2s;
    }
    .input-wrap:focus-within .input-icon { color: var(--blue); }

    .input-status {
      position: absolute; right: 13px; top: 50%; transform: translateY(-50%);
      font-size: 0.82rem; display: none; pointer-events: none;
    }

    /* phone row */
    .phone-row { display: flex; gap: 8px; }

    .phone-prefix {
      display: flex; align-items: center; gap: 6px;
      background: var(--surface3); border: 1px solid var(--border);
      border-radius: 11px; padding: 0 14px;
      font-size: 0.875rem; font-weight: 600; color: var(--text);
      white-space: nowrap; flex-shrink: 0;
    }
    .phone-prefix i { color: var(--blue); }
    .phone-row .input-wrap { flex: 1; }

    /* file upload */
    .file-area {
      position: relative; border: 2px dashed var(--border);
      border-radius: 11px; padding: 18px 16px; text-align: center;
      cursor: pointer; transition: all 0.2s; background: var(--surface2);
    }
    .file-area:hover { border-color: rgba(26,115,248,0.4); background: rgba(26,115,248,0.04); }
    .file-area.has-file { border-color: rgba(34,197,94,0.4); background: rgba(34,197,94,0.04); }
    .file-area input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .file-icon { font-size: 1.3rem; color: var(--muted); margin-bottom: 6px; }
    .file-label { font-size: 0.78rem; color: var(--muted); }
    .file-label strong { color: #7bb3ff; }
    .file-hint { font-size: 0.68rem; color: rgba(123,141,176,0.45); margin-top: 3px; }
    .file-name { font-size: 0.72rem; color: var(--green); margin-top: 5px; display: none; }

    /* section divider */
    .section-sep {
      height: 1px; background: var(--border); margin: 22px 0;
    }

    /* checkbox */
    .checkbox-wrap { display: flex; align-items: flex-start; gap: 10px; cursor: pointer; margin-bottom: 24px; }
    .checkbox-wrap input[type="checkbox"] { display: none; }
    .custom-check {
      width: 18px; height: 18px; border-radius: 5px; flex-shrink: 0; margin-top: 1px;
      border: 1px solid var(--border); background: var(--surface2);
      display: flex; align-items: center; justify-content: center; transition: all 0.2s;
    }
    .checkbox-wrap input:checked + .custom-check { background: var(--blue); border-color: var(--blue); }
    .checkbox-wrap input:checked + .custom-check::after { content: '✓'; font-size: 0.62rem; color: white; font-weight: 700; }
    .checkbox-text { font-size: 0.78rem; color: var(--muted); line-height: 1.5; }
    .checkbox-text a { color: #7bb3ff; text-decoration: none; }
    .checkbox-text a:hover { text-decoration: underline; }

    /* submit row */
    .submit-row { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; }

    .btn-submit {
      display: flex; align-items: center; gap: 8px;
      background: var(--blue); color: white; border: none;
      padding: 13px 28px; border-radius: 50px;
      font-family: 'DM Sans', sans-serif; font-size: 0.9rem; font-weight: 500;
      cursor: pointer; transition: all 0.22s; position: relative; overflow: hidden;
    }
    .btn-submit::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.14), transparent);
      opacity: 0; transition: opacity 0.2s;
    }
    .btn-submit:hover { background: var(--blue-dark); transform: translateY(-2px); box-shadow: 0 10px 28px rgba(26,115,248,0.4); }
    .btn-submit:hover::before { opacity: 1; }
    .btn-submit:active { transform: translateY(0); }

    .back-link {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.78rem; color: rgba(123,141,176,0.5);
      text-decoration: none; transition: color 0.2s;
    }
    .back-link:hover { color: var(--muted); }

    /* card footer */
    .card-footer-bar {
      border-top: 1px solid var(--border);
      padding: 14px 32px;
      display: flex; align-items: center; justify-content: space-between;
      flex-wrap: wrap; gap: 8px;
    }
    .footer-copy { font-size: 0.72rem; color: rgba(123,141,176,0.45); }
    .footer-home {
      display: flex; align-items: center; gap: 5px;
      font-size: 0.72rem; color: rgba(123,141,176,0.5);
      text-decoration: none; transition: color 0.2s;
    }
    .footer-home:hover { color: var(--muted); }

    @keyframes fadeSlideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 560px) {
      .card-header, .card-body { padding-left: 20px; padding-right: 20px; }
      .card-footer-bar { padding: 12px 20px; }
      .fields-grid { grid-template-columns: 1fr; }
      .fields-grid .full-width { grid-column: 1; }
    }
  </style>
</head>
<body>

<div class="bg-grid"></div>
<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<!-- TOP BAR -->
<div class="top-bar">
  <a class="top-logo" href="/">Fix<span>It</span> ↗</a>
  <span class="admin-chip">
    <div class="chip-dot"></div> Admin Panel
  </span>
</div>

<!-- CARD -->
<div class="card">

  <!-- HEADER -->
  <div class="card-header">
    <div class="header-inner">
      <div class="header-icon">🛡️</div>
      <div class="header-text">
        <div class="header-title">Appoint Officer</div>
        <div class="header-sub">Fill in the details to register a new field officer</div>
      </div>
    </div>
  </div>

  <!-- BODY -->
  <div class="card-body">
    <form action="/appoint-officer" method="post" enctype="multipart/form-data" novalidate>

      <div class="fields-grid">

        <!-- Officer Name -->
        <div class="field-group full-width">
          <div class="field-label"><i class="bi bi-person"></i> Officer Name</div>
          <div class="input-wrap">
            <i class="bi bi-person input-icon"></i>
            <input class="styled-input" type="text" id="officerName" name="officerName"
                   placeholder="Full name e.g. Vikram Singh" required
                   oninput="validateField(this, v => v.trim().length >= 3)" />
            <span class="input-status" id="officerName-status"></span>
          </div>
        </div>

        <!-- Email -->
        <div class="field-group full-width">
          <div class="field-label"><i class="bi bi-envelope"></i> Email ID</div>
          <div class="input-wrap">
            <i class="bi bi-envelope input-icon"></i>
            <input class="styled-input" type="email" id="officerEmail" name="officerEmail"
                   placeholder="officer@example.com" required
                   oninput="validateField(this, v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v))" />
            <span class="input-status" id="officerEmail-status"></span>
          </div>
        </div>

        <!-- Phone -->
        <div class="field-group full-width">
          <div class="field-label"><i class="bi bi-telephone"></i> Phone Number</div>
          <div class="phone-row">
            <div class="phone-prefix">
              <i class="bi bi-phone"></i> +91
            </div>
            <div class="input-wrap">
              <i class="bi bi-hash input-icon"></i>
              <input class="styled-input" type="text" id="officerPhone" name="officerPhone"
                     placeholder="10-digit mobile number" pattern="[0-9]{10}" maxlength="10" required
                     oninput="validateField(this, v => /^[0-9]{10}$/.test(v))" />
              <span class="input-status" id="officerPhone-status"></span>
            </div>
          </div>
        </div>

        <!-- Officer ID -->
        <div class="field-group full-width">
          <div class="field-label"><i class="bi bi-fingerprint"></i> Officer ID</div>
          <div class="input-wrap">
            <i class="bi bi-fingerprint input-icon"></i>
            <input class="styled-input" type="text" id="officerId" name="officerId"
                   placeholder="6-digit ID e.g. 482910" pattern="[0-9]{6}" maxlength="6" required
                   oninput="validateField(this, v => /^[0-9]{6}$/.test(v))" />
            <span class="input-status" id="officerId-status"></span>
          </div>
        </div>

      </div>

      <!-- Aadhaar Upload -->
      <div class="field-group">
        <div class="field-label"><i class="bi bi-paperclip"></i> Aadhaar Proof</div>
        <div class="file-area" id="aadhaarArea">
          <input type="file" name="aadhaar" id="aadhaar" accept=".pdf,.jpg,.jpeg,.png"
                 required onchange="handleFile(this)" />
          <div class="file-icon" id="fileIcon">📎</div>
          <div class="file-label" id="fileLabel">
            <strong>Click to upload</strong> or drag & drop
          </div>
          <div class="file-hint">PDF, JPG or PNG · Max 5MB</div>
          <div class="file-name" id="fileName"></div>
        </div>
      </div>

      <div class="section-sep"></div>

      <!-- Terms -->
      <label class="checkbox-wrap">
        <input type="checkbox" id="terms" required />
        <span class="custom-check"></span>
        <span class="checkbox-text">
          I confirm the officer's details are accurate and agree to the
          <a href="#">terms and conditions</a>
        </span>
      </label>

      <!-- Submit -->
      <div class="submit-row">
        <a class="back-link" href="/admin-return-dashboard">
          <i class="bi bi-arrow-left" style="font-size:0.7rem"></i> Back to Dashboard
        </a>
        <button type="submit" class="btn-submit">
          <i class="bi bi-person-check"></i> Appoint Officer
        </button>
      </div>

    </form>
  </div>

  <!-- FOOTER -->
  <div class="card-footer-bar">
    <span class="footer-copy">© FixIt — Online Complaint Registration & Management</span>
    <a class="footer-home" href="/">
      <i class="bi bi-house" style="font-size:0.75rem"></i> Home
    </a>
  </div>

</div>

<script>
  function validateField(input, testFn) {
    const statusEl = document.getElementById(input.id + '-status');
    if (!input.value) {
      input.className = 'styled-input';
      if (statusEl) statusEl.style.display = 'none';
      return;
    }
    const valid = testFn(input.value);
    input.className = 'styled-input ' + (valid ? 'valid' : 'invalid');
    if (statusEl) {
      statusEl.textContent = valid ? '✓' : '✗';
      statusEl.style.color = valid ? '#22c55e' : '#ef4444';
      statusEl.style.display = 'block';
    }
  }

  function handleFile(input) {
    const area = document.getElementById('aadhaarArea');
    const icon = document.getElementById('fileIcon');
    const label = document.getElementById('fileLabel');
    const nameEl = document.getElementById('fileName');
    if (input.files && input.files[0]) {
      area.classList.add('has-file');
      icon.textContent = '✅';
      label.innerHTML = '<strong>File selected</strong>';
      nameEl.textContent = input.files[0].name;
      nameEl.style.display = 'block';
    }
  }
</script>
</body>
</html>
